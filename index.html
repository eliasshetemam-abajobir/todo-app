<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f2f2f2;
        }

        h1, h2 {
            color: #222;
        }

        input {
            padding: 10px;
            width: 60%;
            max-width: 300px;
        }

        button {
            padding: 10px;
            margin: 4px;
            cursor: pointer;
        }

        li {
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

   <h1>My Awesome To-Do List</h1>

    <input id="taskInput" type="text" placeholder="Enter a task">
    <button onclick="addTask()">Add Task</button>

    <h2 id="counter">0 tasks left</h2>

    <ul id="taskList"></ul>

    <script>
        // 1. Load saved tasks from localStorage
        let savedTasks = localStorage.getItem("tasks");
        let tasks = savedTasks ? JSON.parse(savedTasks) : [];

        // 2. Save tasks in localStorage
        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        // 3. Add a new task
        function addTask() {
            let input = document.getElementById("taskInput");
            let taskText = input.value.trim();

            if (taskText === "") {
                return;
            }

            tasks.push({
                text: taskText,
                done: false
            });

            saveTasks();

            input.value = "";
            render();
            input.focus();
        }

        // 4. Complete or undo a task
        function completeTask(index) {
            tasks[index].done = !tasks[index].done;

            saveTasks();
            render();
        }

        // 5. Delete a task
        function deleteTask(index) {
            tasks.splice(index, 1);

            saveTasks();
            render();
        }

        // 6. Display tasks and update the counter
        function render() {
            let list = document.getElementById("taskList");
            list.innerHTML = "";

            tasks.forEach(function(task, index) {
                let li = document.createElement("li");

                let span = document.createElement("span");
                span.textContent = task.text;

                if (task.done) {
                    span.classList.add("done");
                }

                let completeButton = document.createElement("button");

                completeButton.textContent = task.done
                    ? "Undo"
                    : "Complete";

                completeButton.onclick = function() {
                    completeTask(index);
                };

                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";

                deleteButton.onclick = function() {
                    deleteTask(index);
                };

                li.appendChild(span);
                li.appendChild(completeButton);
                li.appendChild(deleteButton);

                list.appendChild(li);
            });

            let remaining = tasks.filter(function(task) {
                return !task.done;
            }).length;

            document.getElementById("counter").textContent =
                remaining + (remaining === 1 ? " task left" : " tasks left");
        }

        // 7. Add a task when Enter is pressed
        document.getElementById("taskInput").addEventListener(
            "keydown",
            function(e) {
                if (e.key === "Enter") {
                    addTask();
                }
            }
        );

        // 8. Display saved tasks when the page opens
        render();
    </script>

</body>
</html>
